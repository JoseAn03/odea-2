<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ODEA 2 — Costa Neón</title>
  <meta name="description" content="ODEA 2 — Costa Neón. Ciudad 2D cenital sobre tu progreso migrado. Las misiones llegan en la Fase 3.">
  <meta name="theme-color" content="#12081F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-has-save="false">
  <a class="skip-link" href="#hud">Saltar al HUD</a>

  <canvas id="city-canvas" role="img"
    aria-label="Mapa cenital de Costa Neón: ciudad de neón con nueve distritos, avenidas y el Monumento al Crédito Permanente."></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <header id="hud" class="hud" hidden></header>

  <span id="version-badge" class="version-badge">v—</span>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <nav id="district-chips" class="chips" aria-label="Distritos de Costa Neón" hidden></nav>

  <button id="floating-import" class="floating-import" hidden>Importar mi progreso</button>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <aside id="sheet" class="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title" hidden></aside>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-panel">
      <header class="overlay-head">
        <div>
          <p class="eyebrow">ODEA 2 · Costa Neón</p>
          <h2 id="overlay-title">Mi progreso</h2>
        </div>
        <button id="overlay-close" class="icon-btn" type="button" aria-label="Cerrar">✕</button>
      </header>
      <div id="overlay-content"></div>
    </div>
  </div>

  <noscript>
    <p class="noscript">ODEA 2 necesita JavaScript para dibujar la ciudad.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
