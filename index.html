<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ODEA 2 — Costa Neón</title>
  <meta name="description" content="ODEA 2 — Costa Neón. Ciudad 2D cenital y Hub diario sobre tu progreso migrado desde ODEA 1.">
  <meta name="theme-color" content="#12081F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/campaign.css">
</head>
<body data-has-save="false">
  <a class="skip-link" href="#hud">Saltar al HUD</a>

  <canvas id="city-canvas" role="img"
    aria-label="Mapa de Costa Neón: isla tropical, Zona Gamer al noreste y El Brete al sur. También accesibles desde el teléfono."></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <header id="hud" class="hud" hidden></header>

  <span id="version-badge" class="version-badge">v—</span>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>


  <nav id="tabbar" class="tabbar" aria-label="Navegación principal" hidden></nav>

  <button id="floating-import" class="floating-import" hidden>Importar mi progreso</button>

  <button id="walk-btn" class="walk-btn" hidden>🚶 Caminar</button>

  <div id="phone-backdrop" class="phone-backdrop" hidden>
    <div id="phone" class="phone" role="dialog" aria-modal="true" aria-label="Teléfono de Costa Neón">
      <div class="phone-camera" aria-hidden="true"></div>
      <div class="phone-speaker" aria-hidden="true"></div>
      <div class="phone-screen">
        <div class="phone-status"><span id="phone-clock">--:--</span><span class="phone-status-net">ODEA 2</span></div>
        <div id="phone-home" class="phone-home">
          <button class="phone-app" type="button" data-app="missions"><span class="phone-app-icon" aria-hidden="true">🎯</span><span>Misiones</span></button>
          <button class="phone-app" type="button" data-app="brete"><span class="phone-app-icon" aria-hidden="true">▥</span><span>El Brete</span></button>
          <button class="phone-app" type="button" data-app="gamer"><span class="phone-app-icon" aria-hidden="true">▷</span><span>Zona Gamer</span></button>
          <button class="phone-app" type="button" data-app="map"><span class="phone-app-icon" aria-hidden="true">🗺️</span><span>Mapa</span></button>
          <button class="phone-app" type="button" data-app="bag"><span class="phone-app-icon" aria-hidden="true">🎒</span><span>Inventario</span></button>
          <button class="phone-app" type="button" data-app="gear"><span class="phone-app-icon" aria-hidden="true">⚙️</span><span>Ajustes</span></button>
        </div>
        <div id="phone-missions" class="phone-missions" hidden></div>
      </div>
      <button id="phone-home-btn" class="phone-home-btn" type="button" aria-label="Inicio del teléfono"></button>
    </div>
  </div>

  <div id="career-backdrop" class="career-backdrop" hidden>
    <section id="career-dialog" class="career-dialog" role="dialog" aria-modal="true" aria-label="Campañas profesionales de Costa Neón" tabindex="-1"></section>
  </div>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <aside id="sheet" class="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title" hidden></aside>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-panel">
      <header class="overlay-head">
        <div>
          <p class="eyebrow">ODEA 2 · Costa Neón</p>
          <h2 id="overlay-title">Mi progreso</h2>
        </div>
        <button id="overlay-close" class="icon-btn" type="button" aria-label="Cerrar">✕</button>
      </header>
      <div id="overlay-content"></div>
    </div>
  </div>

  <noscript>
    <p class="noscript">ODEA 2 necesita JavaScript para dibujar la ciudad.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
